<svg viewBox="0 0 840 460" width="840" height="460" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','SFMono-Regular',Menlo,Monaco,'Cascadia Code','Roboto Mono',Consolas,monospace" role="img" aria-label="Terminal: manu mishra — software engineer, ai/ml, systems design">
