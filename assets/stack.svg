<svg viewBox="0 0 840 282" width="840" height="282" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','SFMono-Regular',Menlo,Monaco,'Cascadia Code','Roboto Mono',Consolas,monospace" role="img" aria-label="printenv STACK: languages, backend, ai/ml, cloud, data, observability">
