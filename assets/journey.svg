<svg viewBox="0 0 840 150" width="840" height="150" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'Fira Code', 'Cascadia Code', Menlo, monospace" role="img" aria-label="Career path: design 2021 to systems 2026">
  <title>design &#8594; ui/ux &#8594; full-stack &#8594; ai/ml &#8594; systems</title>

  <!-- track -->
  <line x1="70" y1="82" x2="770" y2="82" stroke="#21262d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- animated draw -->
  <line x1="70" y1="82" x2="770" y2="82" stroke="#484f58" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" values="700;0" dur="2.4s" begin="0.2s" fill="freeze"
             calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.15 1"/>
  </line>

  <!-- station: design 2021 -->
  <g opacity="0">
    <text x="70" y="54" font-size="11" fill="#484f58" text-anchor="middle">2021</text>
    <circle cx="70" cy="82" r="6.5" fill="#0d1117" stroke="#484f58" stroke-width="2.5"/>
    <text x="70" y="113" font-size="13.5" fill="#8b949e" text-anchor="middle">design</text>
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.40s" fill="freeze"/>
  </g>

  <!-- station: ui/ux 2023 -->
  <g opacity="0">
    <text x="245" y="54" font-size="11" fill="#484f58" text-anchor="middle">2023</text>
    <circle cx="245" cy="82" r="6.5" fill="#0d1117" stroke="#484f58" stroke-width="2.5"/>
    <text x="245" y="113" font-size="13.5" fill="#8b949e" text-anchor="middle">ui / ux</text>
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.00s" fill="freeze"/>
  </g>

  <!-- station: full-stack 2024 -->
  <g opacity="0">
    <text x="420" y="54" font-size="11" fill="#484f58" text-anchor="middle">2024</text>
    <circle cx="420" cy="82" r="6.5" fill="#0d1117" stroke="#484f58" stroke-width="2.5"/>
    <text x="420" y="113" font-size="13.5" fill="#8b949e" text-anchor="middle">full-stack</text>
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.55s" fill="freeze"/>
  </g>

  <!-- station: ai/ml 2025 -->
  <g opacity="0">
    <text x="595" y="54" font-size="11" fill="#484f58" text-anchor="middle">2025</text>
    <circle cx="595" cy="82" r="6.5" fill="#0d1117" stroke="#484f58" stroke-width="2.5"/>
    <text x="595" y="113" font-size="13.5" fill="#8b949e" text-anchor="middle">ai / ml</text>
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.10s" fill="freeze"/>
  </g>

  <!-- station: systems 2026 (active) -->
  <g opacity="0">
    <text x="770" y="54" font-size="11" fill="#8b949e" text-anchor="middle">2026</text>
    <circle cx="770" cy="82" r="7" fill="#0d1117" stroke="#c9d1d9" stroke-width="2.5"/>
    <circle cx="770" cy="82" r="2.6" fill="#c9d1d9"/>
    <text x="770" y="113" font-size="13.5" fill="#c9d1d9" font-weight="600" text-anchor="middle">systems</text>
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.70s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.2s" begin="3.1s" repeatCount="indefinite"/>
  </g>
</svg>
